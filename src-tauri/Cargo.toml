[package]
name = "tauri-bootstrap-demo"
version = "0.1.0"
edition = "2021"
description = "Tauri 2 + Vue 3 + Naive UI bootstrap template"

[lib]
name = "tauri_bootstrap_demo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
